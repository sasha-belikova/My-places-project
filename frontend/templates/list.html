<div id="countries-data">
    {% for country, coordinates in countries_list.items() %}
        <div class="every-item">
            <span>{{ country }}</span>
            <button class="delete-button"
                data-type="country"
                data-id="{{ coordinates['id'] }}"
                data-name="{{ country }}">×</button>
        </div>
    {% endfor %}
</div>

<div id="cities-data">
    {% for city, coordinates in cities_list.items() %}
        <div class="every-item">
            <span>{{ city }}</span>
            <button class="delete-button"
                    data-type="city"
                    data-id="{{ coordinates['id'] }}">×</button>
        </div>
    {% endfor %}
</div>
