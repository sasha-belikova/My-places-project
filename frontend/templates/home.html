<!DOCTYPE html>
<html>

<head>
    <title>My Places</title>

    {{ header | safe }}

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
    <div class="map-container">
        <div class="map">
            {{ body_html | safe }}
        </div>

        <form class="search-box" id="search-form">
            <input class="form-control"
                   type="text"
                   id="place"
                   name="place"
                   autocomplete="off">
            <button class="btn btn-primary"
                    id="search-button"
                    type="button">SEARCH</button>
        </form>


        <div class="side-menu">
            <button class="menu-trigger btn btn-primary"
                    type="button">MENU</button>
            <div class="menu-content"> 
                <button class="btn btn-light" type="button" id = "login-button">LOGIN</button>
                <button class="btn btn-light" id = "database-show" type="button"> MY PLACES</button>
        </div>
                <div class = "login-container" id = "login-container">
                        <div class="container-fluid">
                            <h2>Hi there!</h2>
                            <form class="d-flex" id = "login-paste-boxes">
                                <div><label for="username">USERNAME:</label><input class="form-control me-2" id = "username" type="text"/></div>
                                <div><label for="password">PASSWORD:</label><input class="form-control me-2" id = "password" type="password"/></div></form>
                                <form id = "login-container-button">
                                    <button class="btn btn-light" type="button" id = "login-mini-button">LOGIN</button>
                                    <button class="btn btn-light" type="button" id="login-register">REGISTER</button></form>
                        <button class="close-button" id = "login-close-button" type="button">✕</button>
                        </div>
                </div>

        
            </div>
        <div class="alert alert-danger" id="login-error" role="alert">
            Wrong username or password! Please try again!
        </div>
        <div class="alert alert-danger" id="register-error" role="alert">
            This username is already taken! Please try again!
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    {{ script | safe }}
</script>


<script>
    let myMap = Object.values(window).find(
        value => value instanceof L.Map);
</script>

<script>

    function searchPlace() 
        {let place = document.getElementById("place").value;
        fetch("/search/",
            {method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded",},
            body: "place=" + place})
            .then(response =>
                {return response.json();})
            .then(data =>
                {console.log("ANSWER FROM FLASK", data);
            let placeName;
            if (data.city_name) {placeName = data.city_name;}
            else {placeName = data.country_name;}
            let marker = L.marker([data.lat ?? data.country_lat,data.lon ?? data.country_lon])
            .addTo(myMap)
            .bindPopup(`<div class="place-name">${placeName}</div>`);
            marker.openPopup();})
    }
    

    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const loginError = document.getElementById("login-error");
    const registerError = document.getElementById("register-error");
    function Login(action)
        {const username_value = username.value;
        const password_value = password.value;
        const formData = new FormData();

        formData.append("username", username_value);
        formData.append("password", password_value);
        formData.append("action", action);

        fetch("/login/", 
            {method: "POST",
            body: formData })
        .then(response => 
            {if (response.redirected)
                {window.location.href = response.url;}
            else {response.text()
                .then(message => 
                    {if (action === "login")
                        {loginError.style.display = "flex";
                        setTimeout(function(){loginError.style.display = "none";}, 3000);}
                    else
                        {registerError.style.display = "flex";
                        setTimeout(function(){registerError.style.display = "none";}, 3000);}
                    })
                }
            });
        }




    document.getElementById("search-button").onclick = function() 
        {searchPlace();};
    document.getElementById("place").onkeydown = function(event) 
        {if (event.key == "Enter") 
            {event.preventDefault();
            searchPlace();}};





    const loginContainer = document.getElementById("login-container");
    document.getElementById("login-button").onclick = function()
        {loginContainer.style.display = "flex";};
    document.getElementById("login-close-button").onclick = function()
        {loginContainer.style.display = "none";};
    

    const loginInput = document.getElementById("login-mini-button");
    const registInput = document.getElementById("login-register");
    
    loginInput.addEventListener("click", function()
        {Login("login");
        });

    registInput.addEventListener("click", function()
        {Login("register");
        });
    
    

    
</script>

</body>

</html>
