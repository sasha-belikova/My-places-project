<!DOCTYPE html>      # обозначение, что это html док
<html lang="en">     # язык страницы английский
<head>               # тут часть кода, которую пользователь не видит 
    <meta charset="UTF-8">    # кодировка неизвестных символов (например кириллицы)
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
</body>
</html>
